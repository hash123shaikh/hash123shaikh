<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 68" width="1200" height="68" role="img" aria-label="The path">
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#3B6BFF"/><stop offset="0.20" stop-color="#14B8D4"/><stop offset="0.40" stop-color="#22C55E"/><stop offset="0.60" stop-color="#F2D21B"/><stop offset="0.80" stop-color="#FF8A1F"/><stop offset="1.00" stop-color="#F0343F"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060E16"/><stop offset="1" stop-color="#0E2A48"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#8DB9F5" opacity=".16"/></pattern><clipPath id="rc"><rect width="1200" height="68" rx="20"/></clipPath></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<g clip-path="url(#rc)"><rect width="1200" height="68" fill="url(#bg)"/><rect width="1200" height="68" fill="url(#dots)"/><g transform="translate(46 34)"><circle r="20" fill="none" stroke="#3B6BFF" stroke-width="2"/><circle r="13" fill="none" stroke="#22C55E" stroke-width="2"/><circle r="6.5" fill="#F0343F"><animate attributeName="r" values="6.5;9;6.5" dur="2.4s" repeatCount="indefinite"/></circle></g>
<text x="86" y="45" font-size="30" font-weight="800" fill="#fff" letter-spacing="-.5">The path</text>
<rect x="0" y="60" width="1200" height="4" fill="url(#wash)" opacity=".9"/></g></svg>