<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 276" width="1200" height="276" role="img" aria-label="Five steps: scan, outline, measure, select, predict">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.n{font-size:28px;font-weight:800;fill:#0A1620}.t{font-size:24px;font-weight:700;fill:#fff}.d{font-size:16px;fill:#B8CBDB}.k{font-size:22px;font-weight:800;fill:#FF9AA0}
.fl{stroke:#8DB9F5;stroke-width:3;stroke-dasharray:8 8;animation:fl 1s linear infinite}
.s{animation:in .8s both}
@keyframes fl{to{stroke-dashoffset:-16}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
<rect width="1200" height="276" rx="18" fill="#0F1F2D"/><g class="s" style="animation-delay:0.0s"><circle cx="130" cy="78" r="30" fill="#F0787F"/><text class="n" x="130" y="89" text-anchor="middle">1</text><text class="t" x="130" y="136" text-anchor="middle">Scan</text><text class="d" x="130" y="166" text-anchor="middle">Planning CT of a head</text><text class="d" x="130" y="187" text-anchor="middle">and neck cancer patient</text></g><line class="fl" x1="168" y1="78" x2="228" y2="78"/><g class="s" style="animation-delay:0.5s"><circle cx="356" cy="78" r="30" fill="#F0787F"/><text class="n" x="356" y="89" text-anchor="middle">2</text><text class="t" x="356" y="136" text-anchor="middle">Outline</text><text class="d" x="356" y="166" text-anchor="middle">3D nnU-Net draws the</text><text class="d" x="356" y="187" text-anchor="middle">tumour</text><text class="k" x="356" y="244" text-anchor="middle">Dice 0.65</text></g><line class="fl" x1="394" y1="78" x2="454" y2="78"/><g class="s" style="animation-delay:1.0s"><circle cx="582" cy="78" r="30" fill="#F0787F"/><text class="n" x="582" y="89" text-anchor="middle">3</text><text class="t" x="582" y="136" text-anchor="middle">Measure</text><text class="d" x="582" y="166" text-anchor="middle">1,000+ radiomic</text><text class="d" x="582" y="187" text-anchor="middle">features: shape,</text><text class="d" x="582" y="208" text-anchor="middle">brightness, texture</text><text class="k" x="582" y="244" text-anchor="middle">1,000+ features</text></g><line class="fl" x1="620" y1="78" x2="680" y2="78"/><g class="s" style="animation-delay:1.5s"><circle cx="808" cy="78" r="30" fill="#F0787F"/><text class="n" x="808" y="89" text-anchor="middle">4</text><text class="t" x="808" y="136" text-anchor="middle">Select</text><text class="d" x="808" y="166" text-anchor="middle">Metaheuristics keep the</text><text class="d" x="808" y="187" text-anchor="middle">10 that matter</text><text class="k" x="808" y="244" text-anchor="middle">10 features</text></g><line class="fl" x1="846" y1="78" x2="906" y2="78"/><g class="s" style="animation-delay:2.0s"><circle cx="1034" cy="78" r="30" fill="#F0787F"/><text class="n" x="1034" y="89" text-anchor="middle">5</text><text class="t" x="1034" y="136" text-anchor="middle">Predict</text><text class="d" x="1034" y="166" text-anchor="middle">Recurrence risk before</text><text class="d" x="1034" y="187" text-anchor="middle">treatment</text><text class="k" x="1034" y="244" text-anchor="middle">AUC 0.82</text></g></svg>